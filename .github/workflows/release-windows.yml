name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LearnWeave v__VERSION__
          releaseBody: |
            LearnWeave v__VERSION__ Windows release.

            Highlights:
            - Unified SourceConnector runtime for built-in, Zhihu and custom HTTP/JSON discovery
            - Local scanned-PDF OCR fallback with page-aware captured text
            - Visible semantic-search expansion/rerank fallback diagnostics
            - Source-grounded Capture → Inbox → Knowledge → Review workflow
            - Per-task AI routing, fallback models and provider-reported usage
            - ZhiForge database/settings/credential compatibility retained

            Windows assets include the NSIS installer and a standalone portable EXE.

            Licensing:
            - Source-available under PolyForm Noncommercial License 1.0.0
            - Commercial or business use requires a separate written commercial license
            - See LICENSE and COMMERCIAL_LICENSE.md in the repository

            This release was built automatically on a GitHub-hosted Windows runner from the tagged source revision.
          releaseDraft: false
          prerelease: false

      - name: Upload portable executable to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $portable = "LearnWeave-${{ github.ref_name }}-Windows-x64-Portable.exe"
          Copy-Item "src-tauri/target/release/learnweave.exe" $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber

          $assets = @()
          $assets += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File
          $assets += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File
          $assets += Get-Item $portable
          $lines = $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "SHA256SUMS.txt"
          gh release upload "${{ github.ref_name }}" "SHA256SUMS.txt" --clobber

      - name: Build Tauri bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm tauri build

      - name: Upload verification artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LearnWeave-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
